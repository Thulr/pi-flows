name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release for the pushed tag
  id-token: write # OIDC token for npm trusted publishing (also signs provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Pushed tag $GITHUB_REF_NAME does not match package.json ($pkg). Bump package.json and PI_FLOWS_VERSION before tagging."
            exit 1
          fi
      - run: npm publish # auth via OIDC trusted publisher; provenance is automatic
      - name: Create GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        # After npm publish on purpose: a failed publish must not leave a
        # Release pointing at a version the registry never got.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## /{ if (insec) exit; if ($2 == ver) { insec=1; next } }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver; smoke should have caught this."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
