name: Publish

# Two triggers cut the same release path:
# - a push to main (normally the develop -> main release PR merging) releases
#   the version in package.json, unless that version's tag already exists;
# - a pushed v*.*.* tag is the manual escape hatch and must match package.json.
# The npm trusted publisher is bound to this workflow's filename, so the
# publish step must stay in publish.yml.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]

# One release at a time: a second push must run its tag check only after the
# preceding publish finishes, or both could see their tag as absent and race
# npm's latest dist-tag. Not canceling: an in-flight publish must complete.
# GitHub keeps one pending run per group, so of several queued pushes only the
# newest runs; a version skipped that way is completed by rerunning its run or
# pushing its tag.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # push the release tag and create the GitHub Release
  id-token: write # OIDC token for npm trusted publishing (also signs provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm ci --ignore-scripts
      - name: Decide whether this push cuts or completes a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        # A release is three artifacts: the npm version, the tag, and the
        # GitHub Release. Any one missing means run; each later step skips the
        # artifacts that already exist. So a rerun after a partial release
        # completes whatever is missing instead of no-opping on the tag alone.
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Pushed tag $GITHUB_REF_NAME does not match package.json ($tag). Bump package.json and PI_FLOWS_VERSION before tagging."
            exit 1
          fi
          missing=""
          npm view "pi-flows@${tag#v}" version > /dev/null 2>&1 || missing="$missing npm"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || missing="$missing tag"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || missing="$missing release"
          if [ -n "$missing" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag; missing:$missing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag is fully released (npm version, tag, and GitHub Release all exist); nothing to do."
          fi
      - run: npm run check
        if: steps.decide.outputs.release == 'true'
      - name: Publish to npm
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        # The registry check makes a rerun after a partial release safe: a
        # version npm already has is not republished, and the rerun continues
        # to the tag and Release steps the failed run may have missed.
        run: |
          ver="${TAG#v}"
          if npm view "pi-flows@$ver" version > /dev/null 2>&1; then
            echo "npm already has $ver; skipping publish."
          else
            npm publish # auth via OIDC trusted publisher; provenance is automatic
          fi
      - name: Tag the release commit
        if: steps.decide.outputs.release == 'true' && github.ref_type == 'branch'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        # After npm publish on purpose: a failed publish must not leave a tag
        # naming a version the registry never got. A tag pushed with the
        # workflow token does not retrigger this workflow.
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; skipping."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release from the CHANGELOG section
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          ver="${TAG#v}"
          awk -v ver="$ver" '
            /^## /{ if (insec) exit; if ($2 == ver) { insec=1; next } }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver; smoke should have caught this."
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --verify-tag \
              --title "$TAG" --notes-file /tmp/release-notes.md
          fi
