name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The foreign-import ledger is shrink-only, which the gate can only verify
      # against the revision the change started from. Empty on push, where the
      # script falls back to origin/main.
      DOMAIN_SCORE_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the base revision above is reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  # Reporting only. `npm run check` above is the gate that fails on a structural
  # regression or a failed/missing judgment row; this job exists so the score —
  # including carried (stale) judgment rows — is visible on the PR itself rather
  # than buried in a log.
  domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Judgment staleness is content-digest based and needs no history,
          # but the shrink-only foreign-import debt ledger compares against the
          # merge-base with origin/main, which does.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Score the domain model
        run: node scripts/domain-score.mjs --summary | tee /tmp/domain-score.md >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs, and Dependabot-triggered runs, get a read-only token even when
      # the head repo matches, so they keep the step summary and skip the comment
      # rather than failing a reporting-only job on a permission they never had.
      - name: Post the score on the PR
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- domain-model-score -->"
        run: |
          printf '%s\n' "$MARKER" | cat - /tmp/domain-score.md > /tmp/domain-comment.md
          # --jq runs per page under --paginate, so take the first match across pages.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@/tmp/domain-comment.md
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@/tmp/domain-comment.md
          fi
