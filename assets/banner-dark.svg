<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="pi-flows — delegate, budget, verify, trace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="296" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- flow-graph motif: parent fans out to three children, results merge back -->
  <g stroke="#6e7681" stroke-width="2.5" fill="none">
    <path d="M 196 138 C 240 108, 258 92, 296 84"/>
    <path d="M 200 150 H 294"/>
    <path d="M 196 162 C 240 192, 258 208, 296 216"/>
    <path d="M 342 84 C 380 92, 398 118, 426 138" stroke-dasharray="6 5"/>
    <path d="M 344 150 H 424" stroke-dasharray="6 5"/>
    <path d="M 342 216 C 380 208, 398 182, 426 162" stroke-dasharray="6 5"/>
  </g>

  <!-- parent node with a hand-drawn pi glyph -->
  <circle cx="160" cy="150" r="40" fill="url(#accent)"/>
  <g stroke="#0d1117" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 140 136 H 180"/>
    <path d="M 149 136 V 170"/>
    <path d="M 171 136 V 164 Q 171 171 178 170"/>
  </g>

  <!-- children -->
  <circle cx="319" cy="84" r="17" fill="#161b22" stroke="#818cf8" stroke-width="3.5"/>
  <circle cx="319" cy="150" r="17" fill="#161b22" stroke="#a78bfa" stroke-width="3.5"/>
  <circle cx="319" cy="216" r="17" fill="#161b22" stroke="#c4b5fd" stroke-width="3.5"/>

  <!-- merge node: the compact result returned to the parent -->
  <circle cx="448" cy="150" r="22" fill="#161b22" stroke="#818cf8" stroke-width="3.5"/>
  <path d="M 439 150 L 446 157 L 458 142" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- wordmark -->
  <text x="560" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="78" font-weight="700" fill="#e6edf3">pi-flows</text>
  <text x="564" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#9198a1">delegate · budget · verify · trace</text>
</svg>
